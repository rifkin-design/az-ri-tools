<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow"><title>AZ-RI Tools</title>
<style>
  :root{ --navy:#0f2a44; --olive:#6b7540; --olive-dark:#4a5230; --sand:#f4f1e8; --ink:#1f2115; --grey:#5a5c50; --rule:#d9ddc9; }
  *{box-sizing:border-box;}
  body{ margin:0; font-family:"Helvetica Neue",Helvetica,Arial,sans-serif; color:var(--ink); background:var(--sand); line-height:1.5; }
  .wrap{ max-width:760px; margin:0 auto; padding:28px 18px 48px; }

  .header{ display:flex; align-items:flex-end; justify-content:space-between; gap:18px; border-bottom:3px solid var(--olive); padding-bottom:12px; }
  .header img{ height:58px; width:auto; }
  .header .contact{ text-align:right; font-size:12px; color:var(--grey); line-height:1.6; }
  .header .contact .lead{ color:var(--olive-dark); font-weight:700; }

  .banner{ background:linear-gradient(135deg,var(--navy),#183a5c); color:#fff; border-radius:12px; padding:26px 24px; margin:20px 0 10px; }
  .banner h1{ margin:0; font-size:26px; letter-spacing:.3px; }
  .banner p{ margin:8px 0 0; font-size:14px; color:#d7e2ee; }

  .note{ background:#eef0e4; border-left:4px solid var(--olive); border-radius:0 8px 8px 0; padding:12px 16px; font-size:13.5px; color:var(--ink); margin:14px 0 22px; }
  .note b{ color:var(--olive-dark); }

  .cards{ display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  @media (max-width:620px){ .cards{ grid-template-columns:1fr; } }

  .card{ background:#fff; border:1px solid var(--rule); border-radius:12px; padding:20px 20px 18px; display:flex; flex-direction:column; box-shadow:0 2px 8px rgba(15,42,68,0.06); }
  .card h2{ margin:0 0 6px; font-size:18px; color:var(--navy); }
  .card p{ margin:0 0 16px; font-size:13.5px; color:var(--grey); flex:1; }
  .card a.btn{ display:inline-block; text-align:center; text-decoration:none; background:var(--olive); color:#fff; font-weight:700; font-size:14px; padding:11px 18px; border-radius:8px; transition:background .15s; }
  .card a.btn:hover{ background:var(--olive-dark); }

  .foot{ text-align:center; font-size:12px; color:#9a9c88; margin-top:30px; }
</style>
<style>
  .lock{ background:#fff; border:1px solid var(--rule); border-radius:12px; padding:28px 24px; max-width:380px; margin:40px auto 0; text-align:center; }
  .lock h1{ margin:0 0 6px; font-size:22px; color:var(--navy); }
  .lock p{ margin:0 0 18px; font-size:14px; color:var(--grey); }
  .lock form{ display:flex; flex-direction:column; gap:10px; }
  .lock input{ font:inherit; font-size:15px; padding:11px 12px; border:1px solid var(--rule); border-radius:8px; }
  .lock input:focus{ outline:2px solid var(--olive); outline-offset:1px; }
  .lock button{ font:inherit; font-weight:700; font-size:15px; color:#fff; background:var(--olive); border:0; border-radius:8px; padding:12px; cursor:pointer; }
  .lock button:hover{ background:var(--olive-dark); }
  .lock .lock-err{ color:#a33; margin:12px 0 0; }
</style></head>

  var KEY='azriHubKey';
  function de(s){return Uint8Array.from(atob(s),function(c){return c.charCodeAt(0)});}
  function en(a){return btoa(String.fromCharCode.apply(null,new Uint8Array(a)));}
  function derive(pw){
    return crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']).then(function(k){
      return crypto.subtle.deriveBits({name:'PBKDF2',salt:de(P.s),iterations:P.n,hash:'SHA-256'},k,256);});
  }
  function open(raw){
    return crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']).then(function(k){
      return crypto.subtle.decrypt({name:'AES-GCM',iv:de(P.i)},k,de(P.c));
    }).then(function(pt){ document.querySelector('.wrap').innerHTML=new TextDecoder().decode(pt); });
  }
  function showLock(){
    var lock=document.getElementById('lock'), f=document.getElementById('lockForm'),
        pw=document.getElementById('lockPw'), err=document.getElementById('lockErr');
    lock.hidden=false; pw.focus();
    f.addEventListener('submit',function(e){
      e.preventDefault(); err.hidden=true;
      var raw; derive(pw.value).then(function(r){ raw=r; return open(r); }).then(function(){
        try{ localStorage.setItem(KEY,P.s+'|'+en(raw)); }catch(x){}
      }).catch(function(){ err.hidden=false; pw.select(); });
    });
  }
  var saved=null; try{ saved=localStorage.getItem(KEY); }catch(x){}
  if(saved && saved.split('|')[0]===P.s){ open(de(saved.split('|')[1])).catch(showLock); } else { showLock(); }
